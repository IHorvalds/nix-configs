[alias]
        co = "checkout"
        nb = "switch -c"

        st = "status"

        cm = "commit -s -m"
        cc = "commit -s -e"
        ca = "commit -s --amend"

        ls = "branch -l"

        rr = "restore --staged --worktree"

        hh = "rev-parse HEAD"
        sh = "rev-parse --short HEAD"

        hh-clip = "!git rev-parse HEAD | wl-copy -n"
        sh-clip = "!git rev-parse --short HEAD | wl-copy -n"

        gg = "grep -E --line-number"

        psf = "push --force"
        spf = "push --force" # Too much sun

        # fat fingers...
        puhs = "push"
        psuh = "push"

        dc = "diff --check"

        cleanall = "clean -fdx"

        gone-remote = "!git branch --format '%(if:equals=[gone])%(upstream:track)%(then)%(refname:short)%(end)' | sed '/^$/d'"
        no-remote = "!git branch --format '%(if:equals=)%(upstream)%(then)%(refname:short)%(end)' | sed '/^$/d'"

        # set upstream
        su = "!git branch -u $1/$2 $2 #"

        suir = "submodule update --init --recursive"

        # list files ignored by gitignore
        ignored = "ls-files -i -c --exclude-per-directory=.gitignore"

        # list aliases
        alias = "!git config --get-regexp ^alias\\. | sed -e s/^alias\\.// -e s/\\ /\\ =\\ / #"
